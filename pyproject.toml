[project]
name = "fastapi-uv-starter"
version = "0.1.0"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
description = "A starter project using Python, FastAPI and uv."
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["fastapi[standard]>=0.162.0", "structlog>=26.1.0"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.98",
]
