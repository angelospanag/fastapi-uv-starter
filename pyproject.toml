# This project uses `uv` for dependency management. `uv export` works natively without Poetry plugins.
[project]
name = "fastapi-uv-starter"
version = "0.1.0"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
description = "A starter project using Python, FastAPI and uv."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi[standard]>=0.141.1", "structlog>=26.1.0"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
