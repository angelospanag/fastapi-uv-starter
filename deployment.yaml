apiVersion: v1
kind: Service
metadata:
  name: fastapi-uv-starter
spec:
  selector:
    app: fastapi-uv-starter
  ports:
  - protocol: "TCP"
    port: 8000
    targetPort: 80
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-uv-starter
spec:
  selector:
    matchLabels:
      app: fastapi-uv-starter
  replicas: 4
  template:
    metadata:
      labels:
        app: fastapi-uv-starter
    spec:
      containers:
      - name: fastapi-uv-starter
        image: fastapi-uv-starter:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
