name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Type check
        run: mise run typecheck

      - name: Vulnerability audit
        run: mise run vuln

      - name: Run tests
        run: mise run test
